name: CI

on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'chore/**', 'release/**']
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # publication des journaux sur ci-logs/*

env:
  FLUTTER_CHANNEL: stable
  FLUTTER_VERSION: 3.47.9

jobs:
  quality:
    name: Analyse, tests, captures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Dépendances
        run: |
          mkdir -p ci-out
          set -o pipefail
          flutter pub get 2>&1 | tee ci-out/pub_get.log
          cp pubspec.lock ci-out/pubspec.lock
      - name: Formatage (informatif)
        run: dart format --output=none --set-exit-if-changed lib test > ci-out/format.log 2>&1 || echo "::warning::fichiers non formatés, voir format.log"
      - name: Analyse statique
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee ci-out/analyze.log
      - name: Tests unitaires et widgets
        if: success() || failure()
        run: |
          set -o pipefail
          flutter test --exclude-tags screenshots --coverage --reporter expanded 2>&1 | tee ci-out/test.log
          cp -r test_reports/. ci-out/ 2>/dev/null || true
      - name: Captures d'écran
        if: success() || failure()
        run: |
          set -o pipefail
          flutter test --tags screenshots --update-goldens 2>&1 | tee ci-out/screenshots.log
          mkdir -p ci-out/screenshots && cp test/screenshots/goldens/*.png ci-out/screenshots/ || true
      - name: Rapport de couverture et résumé des tests
        if: success() || failure()
        run: |
          cp coverage/lcov.info ci-out/ 2>/dev/null || true
          python3 .github/scripts/test_summary.py ci-out > ci-out/test_summary.md || true
          cat ci-out/test_summary.md || true
      - name: Publier les journaux
        if: always() && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: .github/scripts/publish_logs.sh quality ci-out

  android:
    name: APK Android
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Libérer de l'espace disque (NDK + ML Kit + MapLibre sont volumineux)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk/2[0-6]* /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/share/powershell
          sudo docker image prune --all --force > /dev/null || true
          df -h /
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'  # maplibre_gl compile en Java 21
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Compilation APK (debug, installable sur téléphone de test)
        run: |
          mkdir -p ci-out
          set -o pipefail
          flutter build apk --debug --target-platform android-arm64 --dart-define-from-file=config/dev.env 2>&1 | tee ci-out/build_apk.log
          cp build/app/outputs/flutter-apk/app-debug.apk ci-out/vigiroad-dev-debug.apk
          ls -la ci-out
          df -h /
      # Publié comme pré-release (et non artefact Actions) : pas soumis au quota
      # de stockage des artefacts. Toujours la dernière compilation réussie.
      - name: Publier l'APK de test (pré-release apk-dev)
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk-dev --cleanup-tag --yes || true
          gh release create apk-dev ci-out/vigiroad-dev-debug.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "APK de test (développement)" \
            --notes "Compilation debug, environnement dev. Branche ${GITHUB_REF_NAME}, commit ${GITHUB_SHA::8}. Ne pas distribuer."
      - name: Compilation APK release (branche main et étiquettes v*)
        if: success() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/'))
        env:
          KEYSTORE_B64: ${{ secrets.VR_KEYSTORE_BASE64 }}
          VR_KEYSTORE_PASSWORD: ${{ secrets.VR_KEYSTORE_PASSWORD }}
          VR_KEY_ALIAS: ${{ secrets.VR_KEY_ALIAS }}
          VR_KEY_PASSWORD: ${{ secrets.VR_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export VR_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
            echo "Signature : clé de distribution"
          else
            echo "::warning::Aucune clé de distribution : APK release signé avec la clé de débogage"
          fi
          # Libère la mémoire de la compilation debug (démon Gradle, Kotlin).
          (cd android && ./gradlew --stop) || true
          pkill -f 'KotlinCompileDaemon' || true
          rm -rf build/app/intermediates build/app/tmp
          free -m
          flutter build apk --release --split-per-abi --target-platform android-arm64,android-arm --dart-define-from-file=config/prod.env 2>&1 | tee ci-out/build_apk_release.log
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ci-out/vigiroad-1.0.0-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ci-out/vigiroad-1.0.0-arm32.apk
          ls -la ci-out/*.apk
      - name: Publier la release (étiquette v* ou branche release/v*)
        if: success() && github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Étiquette : celle poussée, ou dérivée de la branche release/vX.Y.Z.
          TAG="${GITHUB_REF_NAME#release/}"
          # Crée la release (et l'étiquette sur ce commit) si elle n'existe pas encore.
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            {
              echo "**VIGIROAD ${TAG#v}** — GPS intelligent, lecture de plaques sur l'appareil, alertes et assistant vocal SENTRIX."
              echo
              echo "- \`vigiroad-1.0.0-arm64.apk\` : téléphones Android 64 bits (recommandé)"
              echo "- \`vigiroad-1.0.0-arm32.apk\` : anciens téléphones 32 bits"
              echo
              echo "Installation : [docs/INSTALL.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/INSTALL.md)"
              echo
              tail -n +2 docs/RELEASE_NOTES_1.0.md
            } > "$RUNNER_TEMP/notes.md"
            gh release create "$TAG" --title "VIGIROAD ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md" --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" ci-out/vigiroad-1.0.0-arm64.apk ci-out/vigiroad-1.0.0-arm32.apk --clobber
      - name: Publier les journaux
        if: always() && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          ls -la ci-out/*.apk > ci-out/apk_sizes.txt 2>/dev/null || true
          rm -f ci-out/*.apk
          .github/scripts/publish_logs.sh android ci-out

  ios:
    name: Build iOS (non signé)
    needs: quality
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Compilation iOS sans signature
        run: |
          mkdir -p ci-out
          set -o pipefail
          flutter build ios --release --no-codesign --dart-define-from-file=config/dev.env 2>&1 | tee ci-out/build_ios.log
      - name: Publier les journaux
        if: always() && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: .github/scripts/publish_logs.sh ios ci-out
