name: CI

on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'chore/**', 'release/**']
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # publication des journaux sur ci-logs/*

env:
  FLUTTER_CHANNEL: stable
  FLUTTER_VERSION: 3.47.9

jobs:
  quality:
    name: Analyse, tests, captures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Dépendances
        run: |
          mkdir -p ci-out
          set -o pipefail
          flutter pub get 2>&1 | tee ci-out/pub_get.log
          cp pubspec.lock ci-out/pubspec.lock
      - name: Formatage (informatif)
        run: dart format --output=none --set-exit-if-changed lib test > ci-out/format.log 2>&1 || echo "::warning::fichiers non formatés, voir format.log"
      - name: Analyse statique
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee ci-out/analyze.log
      - name: Tests unitaires et widgets
        if: success() || failure()
        run: |
          set -o pipefail
          flutter test --exclude-tags screenshots --coverage --reporter expanded 2>&1 | tee ci-out/test.log
          cp -r test_reports/. ci-out/ 2>/dev/null || true
      - name: Captures d'écran
        if: success() || failure()
        run: |
          set -o pipefail
          flutter test --tags screenshots --update-goldens 2>&1 | tee ci-out/screenshots.log
          mkdir -p ci-out/screenshots && cp test/screenshots/goldens/*.png ci-out/screenshots/ || true
      - name: Rapport de couverture et résumé des tests
        if: success() || failure()
        run: |
          cp coverage/lcov.info ci-out/ 2>/dev/null || true
          python3 .github/scripts/test_summary.py ci-out > ci-out/test_summary.md || true
          cat ci-out/test_summary.md || true
      - name: Publier les journaux
        if: always() && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: .github/scripts/publish_logs.sh quality ci-out

  server:
    name: Agrégateur de trafic (serveur)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Paquet partagé vigiroad_traffic
        working-directory: packages/vigiroad_traffic
        run: |
          mkdir -p ../../ci-out
          set -o pipefail
          dart pub get 2>&1 | tee ../../ci-out/traffic_pub_get.log
          dart analyze --fatal-warnings 2>&1 | tee ../../ci-out/traffic_analyze.log
          dart test --reporter expanded 2>&1 | tee ../../ci-out/traffic_test.log
      - name: Serveur VigiRoadTrafficAggregator
        if: success() || failure()
        working-directory: server
        run: |
          set -o pipefail
          dart pub get 2>&1 | tee ../ci-out/server_pub_get.log
          dart analyze --fatal-warnings 2>&1 | tee ../ci-out/server_analyze.log
          dart test --reporter expanded 2>&1 | tee ../ci-out/server_test.log
      - name: Contrôle réel des limitations (OSRM + Overpass, informatif)
        working-directory: server
        continue-on-error: true
        timeout-minutes: 5
        run: dart run tool/live_speed_check.dart 2>&1 | tee ../ci-out/live_speed_check.log
      - name: Image Docker
        if: success()
        run: |
          set -o pipefail
          docker build -f server/Dockerfile -t vigiroad-traffic:ci . 2>&1 | tee ci-out/docker_build.log
          docker images vigiroad-traffic:ci | tee -a ci-out/docker_build.log
      # Déploiement VPS (server/deploy) : serveur + Caddy en HTTPS, comme en production
      # (certificat local au lieu de Let's Encrypt), puis appels réels à l'API.
      - name: Déploiement Docker Compose (serveur + HTTPS)
        if: success()
        working-directory: server/deploy
        run: |
          set -o pipefail
          printf 'VR_API_KEYS=cle-de-test-ci-1234567890\nVR_DB_PASSWORD=%s\nVR_ADMIN_SECRET=%s\nVR_AGENT_TOKEN=%s\n' \
            "$(openssl rand -hex 16)" "$(openssl rand -hex 32)" "$(openssl rand -hex 24)" > .env
          printf 'VR_DOMAIN=localhost\n' > .domain
          export VR_RUN_DIR=$RUNNER_TEMP/run VR_BACKUP_DIR=$RUNNER_TEMP/backups VR_GEOIP_DIR=$RUNNER_TEMP/geoip
          mkdir -p "$VR_RUN_DIR" "$VR_BACKUP_DIR" "$VR_GEOIP_DIR"
          VR_DOMAIN=localhost docker compose --env-file .env --env-file .domain up -d --build 2>&1 | tail -5 | tee ../../ci-out/compose.log
          for _ in $(seq 1 30); do curl -fsSk https://localhost/health > /dev/null 2>&1 && break; sleep 2; done
          curl -fsSk https://localhost/health | tee -a ../../ci-out/compose.log; echo
          code=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/v1/sources)
          echo "sans clé : HTTP $code" | tee -a ../../ci-out/compose.log
          [ "$code" = 401 ]
          curl -fsSk -H 'X-Api-Key: cle-de-test-ci-1234567890' https://localhost/v1/sources -o /tmp/sources.json
          head -c 400 /tmp/sources.json | tee -a ../../ci-out/compose.log; echo
          docker compose --env-file .env --env-file .domain logs --tail 30 >> ../../ci-out/compose.log 2>&1 || true
          docker compose --env-file .env --env-file .domain down -v > /dev/null 2>&1
      - name: Publier les journaux
        if: always() && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: .github/scripts/publish_logs.sh server ci-out

  android:
    name: APK Android
    # Pas d'APK publié si l'OCR ne fonctionne pas en release.
    needs: [quality, ocr-release]
    runs-on: ubuntu-latest
    steps:
      - name: Libérer de l'espace disque (NDK + ML Kit + MapLibre sont volumineux)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk/2[0-6]* /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/share/powershell
          sudo docker image prune --all --force > /dev/null || true
          df -h /
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'  # maplibre_gl compile en Java 21
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Compilation APK (debug, installable sur téléphone de test)
        env:
          VR_TRAFFIC_API_URL: ${{ secrets.VR_TRAFFIC_API_URL }}
          VR_TRAFFIC_API_KEY: ${{ secrets.VR_TRAFFIC_API_KEY }}
        run: |
          mkdir -p ci-out
          set -o pipefail
          .github/scripts/inject_traffic_config.sh config/dev.env | tee -a ci-out/traffic_config.log
          flutter build apk --debug --target-platform android-arm64 --dart-define-from-file=config/dev.env 2>&1 | tee ci-out/build_apk.log
          cp build/app/outputs/flutter-apk/app-debug.apk ci-out/vigiroad-dev-debug.apk
          ls -la ci-out
          df -h /
      # Publié comme pré-release (et non artefact Actions) : pas soumis au quota
      # de stockage des artefacts. Toujours la dernière compilation réussie.
      - name: Publier l'APK de test (pré-release apk-dev)
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk-dev --cleanup-tag --yes || true
          gh release create apk-dev ci-out/vigiroad-dev-debug.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "APK de test (développement)" \
            --notes "Compilation debug, environnement dev. Branche ${GITHUB_REF_NAME}, commit ${GITHUB_SHA::8}. Ne pas distribuer."
      - name: Compilation APK release (branche main et étiquettes v*)
        if: success() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/'))
        env:
          KEYSTORE_B64: ${{ secrets.VR_KEYSTORE_BASE64 }}
          VR_KEYSTORE_PASSWORD: ${{ secrets.VR_KEYSTORE_PASSWORD }}
          VR_KEY_ALIAS: ${{ secrets.VR_KEY_ALIAS }}
          VR_KEY_PASSWORD: ${{ secrets.VR_KEY_PASSWORD }}
          VR_TRAFFIC_API_URL: ${{ secrets.VR_TRAFFIC_API_URL }}
          VR_TRAFFIC_API_KEY: ${{ secrets.VR_TRAFFIC_API_KEY }}
        run: |
          set -o pipefail
          .github/scripts/inject_traffic_config.sh config/prod.env | tee -a ci-out/traffic_config.log
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export VR_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
            echo "Signature : clé de distribution"
          else
            echo "::warning::Aucune clé de distribution : APK release signé avec la clé de débogage"
          fi
          # Libère la mémoire de la compilation debug (démon Gradle, Kotlin).
          (cd android && ./gradlew --stop) || true
          pkill -f 'KotlinCompileDaemon' || true
          rm -rf build/app/intermediates build/app/tmp
          free -m
          flutter build apk --release --split-per-abi --target-platform android-arm64,android-arm --dart-define-from-file=config/prod.env 2>&1 | tee ci-out/build_apk_release.log
          VER="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "ci-out/vigiroad-$VER-arm64.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "ci-out/vigiroad-$VER-arm32.apk"
          # Certificat de signature : celui de VIGIROAD INC si la clé est fournie.
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "ci-out/vigiroad-$VER-arm64.apk" | tee ci-out/signature.txt
          if [ -n "$KEYSTORE_B64" ] && ! grep -q "O=VIGIROAD INC" ci-out/signature.txt; then
            echo "::error::L'APK n'est pas signé par le certificat VIGIROAD INC"; exit 1
          fi
          ls -la ci-out/*.apk
      - name: Publier la release (étiquette v* ou branche release/v*)
        if: success() && github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Étiquette : celle poussée, ou dérivée de la branche release/vX.Y.Z.
          TAG="${GITHUB_REF_NAME#release/}"
          VER="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          {
            echo "**VIGIROAD ${TAG#v}** — GPS intelligent, lecture de plaques sur l'appareil, alertes et assistant vocal SENTRIX."
            echo
            echo "- \`vigiroad-$VER-arm64.apk\` : téléphones Android 64 bits (recommandé)"
            echo "- \`vigiroad-$VER-arm32.apk\` : anciens téléphones 32 bits"
            echo "- \`vigiroad-$VER-ios-non-signe.ipa\` : iPhone (iOS 16 ou plus), à signer à l'installation — voir [docs/INSTALL_IOS.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/INSTALL_IOS.md)"
            echo
            echo "Installation : [docs/INSTALL.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/INSTALL.md)"
            echo
            # Notes de la version (docs/RELEASE_NOTES_<majeure>.<mineure>.md).
            NOTES="docs/RELEASE_NOTES_$(echo "$VER" | cut -d. -f1,2).md"
            [ -f "$NOTES" ] || NOTES=docs/RELEASE_NOTES_1.0.md
            tail -n +2 "$NOTES"
          } > "$RUNNER_TEMP/notes.md"
          # Crée la release (et l'étiquette sur ce commit) si elle n'existe pas encore.
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "VIGIROAD ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md" --target "$GITHUB_SHA"
          else
            # Release déjà existante (republication depuis la branche release/v*) :
            # l'étiquette suit le commit compilé et les APK d'une autre version
            # sont retirés, pour qu'aucun fichier obsolète ne reste téléchargeable.
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" -f sha="$GITHUB_SHA" -F force=true > /dev/null
            gh release view "$TAG" --json assets -q '.assets[].name' | { grep -v -F -e "vigiroad-$VER-" -e "vigiroad-admin-update.json" || true; } | while read -r old; do
              echo "Retrait de l'APK obsolète : $old"
              gh release delete-asset "$TAG" "$old" --yes
            done
            gh release edit "$TAG" --title "VIGIROAD ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          # Fichier de version lu par les applications installées (mise à jour obligatoire).
          BUILD="$(sed -n 's/^version: *[^+]*+\([0-9]*\).*/\1/p' pubspec.yaml)"
          python3 .github/scripts/update_manifest.py "$VER" "$BUILD" "$TAG" "$GITHUB_REPOSITORY" \
            "ci-out/vigiroad-$VER-arm64.apk" "ci-out/vigiroad-$VER-arm32.apk" ci-out/vigiroad-update.json
          gh release upload "$TAG" "ci-out/vigiroad-$VER-arm64.apk" "ci-out/vigiroad-$VER-arm32.apk" \
            ci-out/vigiroad-update.json --clobber
          # Vérification : ce que les applications liront réellement.
          sleep 10
          curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/vigiroad-update.json" -o "$RUNNER_TEMP/latest.json"
          python3 - "$RUNNER_TEMP/latest.json" "$VER" "ci-out/vigiroad-$VER-arm64.apk" <<'PY'
          import hashlib, json, sys
          m = json.load(open(sys.argv[1]))
          assert m["version"] == sys.argv[2], f"latest = {m['version']}, attendu {sys.argv[2]}"
          assert m["apks"]["arm64-v8a"]["sha256"] == hashlib.sha256(open(sys.argv[3], "rb").read()).hexdigest()
          print("Fichier de mise à jour publié et cohérent :", m["version"], m["build"])
          PY
      - name: Publier les journaux
        if: always() && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          ls -la ci-out/*.apk > ci-out/apk_sizes.txt 2>/dev/null || true
          rm -f ci-out/*.apk
          .github/scripts/publish_logs.sh android ci-out

  ocr-release:
    name: OCR en APK release (émulateur)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Libérer de l'espace disque
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk/2[0-6]* /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/share/powershell
          sudo docker image prune --all --force > /dev/null || true
      - name: Activer KVM (émulateur accéléré)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # Même configuration release (R8 + règles ProGuard) que l'APK publié.
      - name: Compilation de l'APK release de test OCR
        run: |
          mkdir -p ci-out
          set -o pipefail
          flutter build apk --release -t tool/ocr_smoke/main.dart --target-platform android-x64 \
            --dart-define-from-file=config/prod.env 2>&1 | tee ci-out/build_ocr_smoke.log
          mv build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/ocr-smoke.apk"
          # Mot d'activation : modèles ONNX dans un APK release (R8).
          flutter build apk --release -t tool/wakeword_smoke/main.dart --target-platform android-x64 \
            --dart-define-from-file=config/prod.env 2>&1 | tee ci-out/build_wakeword_smoke.log
          mv build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/wakeword-smoke.apk"
          (cd android && ./gradlew --stop) || true
      - name: Lecture d'une plaque par ML Kit dans l'APK release
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          script: |
            .github/scripts/ocr_smoke.sh "$RUNNER_TEMP/ocr-smoke.apk" ci-out VIGIROAD_OCR_SMOKE
            .github/scripts/ocr_smoke.sh "$RUNNER_TEMP/wakeword-smoke.apk" ci-out VIGIROAD_WAKEWORD_SMOKE
      - name: Publier les journaux
        if: always() && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: .github/scripts/publish_logs.sh ocr-release ci-out

  ios:
    name: Build iOS (non signé)
    needs: quality
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Compilation iOS sans signature
        env:
          VR_TRAFFIC_API_URL: ${{ secrets.VR_TRAFFIC_API_URL }}
          VR_TRAFFIC_API_KEY: ${{ secrets.VR_TRAFFIC_API_KEY }}
          IS_RELEASE: ${{ github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')) }}
        run: |
          mkdir -p ci-out
          set -o pipefail
          # Release : configuration de production et serveur de trafic, comme l'APK.
          ENVFILE=config/dev.env
          if [ "$IS_RELEASE" = true ]; then ENVFILE=config/prod.env; fi
          .github/scripts/inject_traffic_config.sh "$ENVFILE" | tee -a ci-out/traffic_config.log
          flutter build ios --release --no-codesign --dart-define-from-file="$ENVFILE" 2>&1 | tee ci-out/build_ios.log
          # IPA non signée (à signer à l'installation : docs/INSTALL_IOS.md).
          VER="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          rm -rf Payload && mkdir Payload && cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "ci-out/vigiroad-$VER-ios-non-signe.ipa" Payload
          ls -la ci-out/*.ipa
      - name: Ajouter l'IPA à la release (branche release/v* ou étiquette v*)
        if: success() && github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME#release/}"
          # La release est créée par le job Android : on l'attend (40 min au plus).
          for _ in $(seq 1 80); do
            gh release view "$TAG" > /dev/null 2>&1 && break
            sleep 30
          done
          gh release upload "$TAG" ci-out/*.ipa --clobber
      - name: Publier les journaux
        if: always() && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          rm -f ci-out/*.ipa
          .github/scripts/publish_logs.sh ios ci-out
