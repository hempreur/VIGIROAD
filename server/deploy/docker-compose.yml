# VigiRoadTrafficAggregator sur un VPS : serveur + Caddy (HTTPS automatique).
# Installé et mis à jour par install.sh ; secrets dans .env (jamais versionné).
services:
  traffic:
    build:
      context: ../..
      dockerfile: server/Dockerfile
    image: vigiroad-traffic:local
    env_file: .env
    environment:
      PORT: "8080"
    restart: unless-stopped
    expose:
      - "8080"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [traffic]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      VR_DOMAIN: ${VR_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  caddy_data:
  caddy_config:
